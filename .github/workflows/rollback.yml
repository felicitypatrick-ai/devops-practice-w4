name: Roll back production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit ID of the last working release"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-report.txt
      - name: Build the package
        run: |
          mkdir -p dist
          cp app/*.py VERSION dist/
      - name: Save the tested package
        uses: actions/upload-artifact@v4
        with:
          name: delivery-app
          path: dist/
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the tested package
        uses: actions/download-artifact@v4
        with:
          name: delivery-app
          path: release/
      - name: Deploy to production
        shell: bash
        run: |
          echo "Deployed to production (rollback): version $(cat release/VERSION), commit $(git rev-parse --short=7 HEAD)" > release/RELEASE.txt
      - name: Save the production release
        uses: actions/upload-artifact@v4
        with:
          name: delivery-production
          path: release/
      - name: Check the release
        shell: bash
        run: |
          python scripts/release_check.py release production | tee release-check.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release-check.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
